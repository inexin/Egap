name: Release

# A tag v<version>, the version of src/Egap.Pdf, publishes the three packages: Egap.Pdf, Egap.Documents and
# Egap.Pdf.Conversion, each at the version in its own project file; a package whose version is already on nuget.org is skipped.
# The push uses nuget.org trusted publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so the
# repository keeps no NuGet key. The trusted publishing policy on nuget.org names this repository, this workflow file and the
# nuget environment, and the nuget environment requires Lars's approval before the job starts. The secret NUGET_USER is the
# nuget.org account name.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the tag against Egap.Pdf's version
        run: |
          version=$(dotnet msbuild src/Egap.Pdf/Egap.Pdf.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Egap.Pdf $version"
            exit 1
          fi
      - name: Build and test
        run: dotnet test Egap.slnx -c Release
      - name: Pack
        run: |
          for package in Egap.Pdf Egap.Documents Egap.Pdf.Conversion; do
            dotnet pack "src/$package" -c Release --no-build -o artifacts/nuget
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/nuget
      - name: Sign in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
