name: CI

# Pull requests run the Linux x64 build and tests and the checks. Pushes to main, the nightly run and manual runs add the other
# platforms.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-linux:
    name: Build and test (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Egap.slnx -c Release
      - run: dotnet test Egap.slnx -c Release --no-build

  build-test:
    name: Build and test (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Egap.slnx -c Release
      - run: dotnet test Egap.slnx -c Release --no-build

  aot-smoke:
    name: Native AOT smoke apps (format add-ons)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Warnings are errors, so any trim or AOT warning fails the publish; the add-ons claim AOT only while these pass.
      - run: dotnet publish tests/Egap.Documents.Markdown.AotSmoke -c Release -r linux-x64 -o artifacts/aot-markdown
      - run: ./artifacts/aot-markdown/Egap.Documents.Markdown.AotSmoke
      - run: dotnet publish tests/Egap.Documents.Html.AotSmoke -c Release -r linux-x64 -o artifacts/aot-html
      - run: ./artifacts/aot-html/Egap.Documents.Html.AotSmoke

  checks:
    name: Format, API and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format
        run: dotnet format Egap.slnx --verify-no-changes
      # The public API baseline (PublicAPI.*.txt) and the analyzers run as part of this build; warnings are errors.
      - name: Build (analyzers and public API baseline)
        run: dotnet build Egap.slnx -c Release
      - name: No package references in src/
        run: |
          # Only build-time analyzers, Egami's packages (Phase 3 design Q2) and .NET's own CMS package (Phase 5 design Q2) are allowed,
          # plus the approved packages in docs/references.md for the format add-ons (Egap.Documents.<Format>) only.
          # Anything else would ship as a dependency.
          allowed='Microsoft.CodeAnalysis.PublicApiAnalyzers Egami Egami.Fonts Egami.Fonts.Substitutes Egami.Drawing Egami.Metafiles Egami.Css Egami.Svg Egami.Barcodes
            System.Security.Cryptography.Pkcs'
          addon_allowed='AngleSharp Markdig'
          status=0
          for proj in $(find src -name '*.csproj'); do
            for pkg in $(dotnet list "$proj" package --include-transitive --format json \
                         | jq -r '.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[] | select(.autoReferenced != "true") | .id'); do
              list="$allowed"
              case "$proj" in src/Egap.Documents.*/*) list="$allowed $addon_allowed" ;; esac
              if ! tr -s ' \n' '\n' <<< "$list" | grep -qxF "$pkg"; then
                echo "::error file=$proj::Package reference '$pkg' is not allowed in src/"
                status=1
              fi
            done
          done
          exit $status
