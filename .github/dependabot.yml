# Weekly update pull requests for the GitHub Actions the workflows use and the NuGet packages in Directory.Packages.props
# (Egami, .NET's CMS package, and test, benchmark and build-time packages). Each ecosystem's updates come in one grouped
# pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # System.Security.Cryptography.Pkcs follows .NET's version: 11.x belongs to .NET 11 and pulls in the
      # System.Formats.Asn1 package, which the CI package check rejects in src/. Stay on the 10.x line that matches .NET 10.
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: ['version-update:semver-major']
